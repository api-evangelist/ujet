aid: ujet
name: UJET
description: >-
  UJET is an AI-powered cloud contact center (CCaaS) platform that unifies
  voice, chat, SMS, email, WhatsApp, and in-app mobile support into a single
  agentic customer-experience system. Built CRM-native so PII stays in the
  customer's CRM rather than the contact center layer, UJET pairs its CCaaS
  foundation with Agentic Experience Orchestration (AXO) and Spiral
  conversational intelligence, and ships embedded mobile and web SDKs for
  in-app support. UJET is the platform behind Google Cloud's Contact Center
  AI (CCAI) Platform and is backed by GV, DCM Ventures, and Sapphire
  Ventures. Its developer documentation is login-gated; the publicly
  verifiable developer surface is its SDKs, GitHub organization, status
  page, and SLA.
